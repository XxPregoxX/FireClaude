<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Claude</title>
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header>
    <button id="btnHistorico" class="icone" title="Conversas anteriores" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line class="l1" x1="4" y1="6" x2="20" y2="6"/><line class="l2" x1="4" y1="12" x2="20" y2="12"/><line class="l3" x1="4" y1="18" x2="20" y2="18"/><g class="x-fixo"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></g></svg></button>
    <div id="titulo" title="Clique pra renomear">Nova conversa</div>
    <button id="btnTema" class="icone" title="Tema: automático / escuro / claro"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <button id="btnFechar" class="icone" title="Fechar o painel (Alt+Shift+C)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  </header>

  <section id="historico" hidden>
    <div class="hist-topo">Conversas</div>
    <button id="btnNova" class="nova-conversa"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nova conversa</button>
    <ul id="listaHist"></ul>
  </section>

  <main id="conversa">
    <div class="vazio" id="vazio">
      <div class="logo">✳</div>
      <p><strong>Como posso ajudar?</strong></p>
      <p>Quando você falar "essa página" ou "o que tem aqui?", eu leio a aba que está aberta (se o site estiver liberado; se não, aparece um botão pra liberar).</p>
      <p>Pedidos de aprovação aparecem aqui na conversa.</p>
    </div>
  </main>


  <footer>
    <div id="marca" hidden></div>
    <div id="longaAviso" hidden><span id="longaTexto"></span><button id="btnContinuar">Continuar em conversa nova</button></div>
    <div id="abaAviso" hidden><span id="abaTexto"></span><button id="abaBotao" hidden></button></div>
    <div class="caixa-entrada">
      <textarea id="entrada" rows="1" placeholder="Escreva pro Claude…"></textarea>
      <div class="barra-entrada">
        <button id="modeloBotao" class="modelo-botao" title="Escolher o modelo"><span id="modeloNome">Modelo</span><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline class="seta-anim" points="6 9 12 15 18 9"/><polyline class="seta-cima" points="6 15 12 9 18 15"/></svg></button>
        <span class="espaco"></span>
        <button id="btnParar" class="enviar" title="Parar" hidden><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg></button>
        <button id="btnEnviar" class="enviar" title="Enviar (Enter)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
      <div id="modeloMenu" hidden></div>
    </div>
    <div id="statusLinha"><span id="status">conectando…</span><button id="usoBotao" hidden title="Ver o gasto desta conversa"></button></div>
    <div id="usoQuadro" hidden></div>
  </footer>

  <div id="modal" hidden>
    <div class="modal-caixa">
      <p id="modalTexto"></p>
      <pre id="modalDetalhe"></pre>
      <div class="modal-botoes">
        <button id="modalCancelar">Cancelar</button>
        <button id="modalOk"></button>
      </div>
    </div>
  </div>

  <script src="tema.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="markdown.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
